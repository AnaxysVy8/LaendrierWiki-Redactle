<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lændrïer Redactle Multiplayer</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #141416;
    --panel-2: #1c1c1f;
    --border: #2a2a2e;
    --text: #eaeaea;
    --muted: #9a9a9f;
    --accent: #22d3c9;
    --redacted-bg: #3a3a3f;
    --redacted-text: #d8d8db;
    --row-hover: #202024;
    --row-selected: #26262b;
    --hint-bg: #4a1414;
    --hint-text: #ffb3b3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: #000;
    flex-wrap: wrap; gap: 10px;
  }
  .logo { font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: 0.5px; }
  .logo span { color: var(--accent); }
  #new-game-btn {
    background: var(--accent); color: #002826; border: none; padding: 8px 16px;
    border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  #new-game-btn:hover { filter: brightness(1.1); }
  #mp-status { color: var(--muted); font-size: 13px; }
  #lobby-link-container { font-size: 13px; color: var(--muted); }
  #lobby-link { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }

  .layout { display: flex; gap: 16px; padding: 20px; align-items: flex-start; }

  #title-label {
    font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px;
  }
  #title-banner {
    font-size: 28px; font-weight: 800; margin-bottom: 18px; line-height: 1.4;
  }
  #title-banner .redacted { font-size: 18px; padding: 2px 10px; }

  #content {
    flex: 1 1 auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 28px; font-size: 19px; line-height: 2;
    min-height: 400px; white-space: pre-wrap;
  }

  .redacted {
    display: inline-block; background: var(--redacted-bg); color: var(--redacted-text);
    border-radius: 4px; padding: 0 6px; margin: 1px 2px; font-family: monospace;
    font-size: 14px; user-select: none; vertical-align: middle;
  }
  .revealed {
    font-weight: 700; color: var(--text); padding: 0 2px; border-radius: 3px;
    cursor: pointer;
  }
  .revealed.hint { background: var(--hint-bg); color: var(--hint-text); }
  .revealed.selected { background: var(--accent); color: #002826; }
  .common { font-weight: 400; color: var(--text); }

  #sidebar {
    flex: 0 0 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; position: sticky; top: 16px;
  }
  #sidebar-stats {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted); margin-bottom: 10px;
  }

  #hint-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
  #hint-buttons button {
    flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 6px; cursor: pointer; font-size: 13px;
  }
  #hint-buttons button:hover:not(:disabled) { background: var(--row-hover); }
  #hint-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }

  #hint-banner {
    display: none; background: var(--hint-bg); color: var(--hint-text);
    border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px;
    font-style: italic;
  }

  #guessForm { display: flex; gap: 6px; margin-bottom: 12px; }
  #guessInput {
    flex: 1; padding: 10px; font-size: 15px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  }
  #guessInput::placeholder { color: var(--muted); }
  #guessForm button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0 14px; cursor: pointer; font-size: 14px;
  }
  #guessForm button:hover { background: var(--row-hover); }

  #guessList { display: flex; flex-direction: column; gap: 2px; max-height: 55vh; overflow-y: auto; }
  .guess-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 10px; border-radius: 6px; cursor: pointer; font-size: 15px;
  }
  .guess-row:hover { background: var(--row-hover); }
  .guess-row.hint { background: var(--hint-bg); color: var(--hint-text); }
  .guess-row.selected { background: var(--row-selected); outline: 1px solid var(--accent); }
  .guess-rank { color: var(--muted); font-size: 12px; width: 28px; flex: 0 0 28px; }
  .guess-row.hint .guess-rank { color: var(--hint-text); opacity: 0.7; }
  .guess-word { flex: 1; }
  .guess-word.correct { color: var(--accent); font-weight: 700; }
  .guess-count { color: var(--muted); font-size: 14px; }
  .guess-row.hint .guess-count { color: var(--hint-text); opacity: 0.8; }

  #empty-hint { color: var(--muted); font-size: 14px; padding: 10px 4px; }

  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    #sidebar { flex: 1 1 auto; width: 100%; position: static; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">LÆNDRÏER <span>REDACTLE</span></div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span id="mp-status">Multiplayer: Verbinde mit Netzwerk...</span>
    <div id="lobby-link-container" style="display:none;">
      Link: <input type="text" id="lobby-link" readonly onclick="this.select()">
    </div>
    <button id="new-game-btn" onclick="startNewGame()">Neues Spiel (Host)</button>
  </div>
</header>

<div class="layout">
  <div id="content-wrap" style="flex:1 1 auto;">
    <div id="title-label">Gesuchter Artikel-Titel:</div>
    <div id="title-banner">Warte auf Spielstart...</div>
    <div id="content">Warte auf Spielstart...</div>
  </div>

  <div id="sidebar">
    <div id="sidebar-stats">
      <span>Versuche: <strong id="attemptCount">0</strong></span>
    </div>

    <div id="hint-buttons">
      <button id="hintSentenceBtn" onclick="useSentenceHint()">💡 Hinweissatz (<span id="sentenceHintsLeftEl">1</span>)</button>
      <button id="hintRevealBtn" onclick="useRevealHint()">🔎 Wort aufdecken (<span id="revealHintsLeftEl">3</span>)</button>
    </div>
    <div id="hint-banner"></div>

    <form id="guessForm" onsubmit="event.preventDefault(); makeGuess();">
      <input type="text" id="guessInput" placeholder="Wort erraten..." oninput="this.value = this.value.replace(/\s+/g, '')">
      <button type="submit">Raten</button>
    </form>
    <div id="guessList"></div>
    <div id="empty-hint">Noch keine Wörter erraten.</div>
  </div>
</div>

<script>
  // Unicode-fähig: erkennt Buchstaben aus ALLEN Sprachen als "Wort"
  const TOKEN_REGEX = /[\p{L}\p{N}_]+|[^\p{L}\p{N}\s]+|\s+/gu;
  const WORD_REGEX = /^[\p{L}\p{N}_]+$/u;

  // Erlaubt alternative Schreibweisen beim Raten (z.B. "Laendrier" statt "Lændrïer")
  function normalize(str) {
    return str
      .toLowerCase()
      .replaceAll("ß", "ss")
      .replaceAll("æ", "ae")
      .replaceAll("œ", "oe")
      .replaceAll("ä", "a")
      .replaceAll("ö", "o")
      .replaceAll("ü", "u")
      .replaceAll("ï", "i")
      .replaceAll("ë", "e")
      .replaceAll("å", "a")
      .replaceAll("ø", "o")
      .trim();
  }

  const ARTICLES_URL = "./articles.json";
  const COMMON_WORDS = new Set(["der", "die", "das", "des", "dem", "den", "ein", "eine", "einer", "eines", "einem", "einen", "und", "oder", "aber", "ist", "sind", "war", "waren", "von", "mit", "in", "im", "auf", "für", "an", "zu", "aus", "bei", "nach", "über", "um", "wie", "als", "auch", "nicht", "es", "er", "sie"]);
  const NO_HINT_TEXT = "Für diesen Artikel wurde noch kein Hinweissatz hinterlegt.";
  const SENTENCE_HINTS_PER_ROUND = 1;
  const REVEAL_HINTS_PER_ROUND = 3;

  let peer, conn;
  let connections = [];
  let isHost = false;
  let rawTokens = [];
  let guessOrder = [];          // [{word, norm, hint}] Reihenfolge der geratenen/aufgedeckten Wörter
  let guessedNorms = new Set(); // normalisierte Formen, für schnellen Abgleich
  let hintNorms = new Set();    // normalisierte Formen, die per Hinweis (nicht geraten) aufgedeckt wurden
  let attempts = 0;
  let targetTitle = "";
  let isWon = false;
  let selectedWord = null;      // aktuell hervorgehobene NORMALISIERTE Form
  let articlesCache = null;

  let articleHint = "";         // Hinweissatz des aktuellen Artikels (lokal bekannt, aber erst nach Nutzung angezeigt)
  let hintRevealed = false;     // ob der Hinweissatz für ALLE sichtbar gemacht wurde
  let sentenceHintsLeft = SENTENCE_HINTS_PER_ROUND; // NUR lokal für diesen Spieler
  let revealHintsLeft = REVEAL_HINTS_PER_ROUND;     // NUR lokal für diesen Spieler

  const urlParams = new URLSearchParams(window.location.search);
  const hostId = urlParams.get('host');

  peer = new Peer();

  peer.on('open', (id) => {
    if (hostId) {
      document.getElementById("mp-status").innerText = "Verbinde mit Host-Lobby...";
      document.getElementById("new-game-btn").style.display = "none";
      conn = peer.connect(hostId);
      setupConnection(conn);
    } else {
      isHost = true;
      document.getElementById("mp-status").innerText = "Du bist der Host!";
      const shareUrl = `${window.location.origin}${window.location.pathname}?host=${id}`;
      document.getElementById("lobby-link").value = shareUrl;
      document.getElementById("lobby-link-container").style.display = "block";
    }
  });

  peer.on('connection', (c) => {
    if (isHost) {
      connections.push(c);
      setupConnection(c);
      setTimeout(() => {
        c.send({
          type: 'INIT', rawTokens, guessOrder, targetTitle, attempts, isWon,
          hint: articleHint, hintRevealed
        });
      }, 500);
    }
  });

  function setupConnection(c) {
    c.on('data', (data) => {
      if (data.type === 'INIT') {
        rawTokens = data.rawTokens;
        guessOrder = data.guessOrder || [];
        guessedNorms = new Set(guessOrder.map(g => g.norm));
        hintNorms = new Set(guessOrder.filter(g => g.hint).map(g => g.norm));
        targetTitle = data.targetTitle;
        attempts = data.attempts;
        isWon = data.isWon;
        articleHint = data.hint || "";
        hintRevealed = !!data.hintRevealed;
        selectedWord = null;
        // Eigene Hinweis-Kontingente sind IMMER frisch, unabhängig vom Host-Stand
        sentenceHintsLeft = SENTENCE_HINTS_PER_ROUND;
        revealHintsLeft = REVEAL_HINTS_PER_ROUND;
        document.getElementById("attemptCount").innerText = attempts;
        renderAll();
      } else if (data.type === 'GUESS') {
        handleGuess(data.guess, false);
      } else if (data.type === 'HINT_SENTENCE') {
        hintRevealed = true;
        renderHintBanner();
      } else if (data.type === 'HINT_REVEAL') {
        applyHintReveal(data.word, data.norm);
      } else if (data.type === 'NEW_GAME') {
        rawTokens = data.rawTokens;
        targetTitle = data.targetTitle;
        articleHint = data.hint || "";
        hintRevealed = false;
        guessOrder = [];
        guessedNorms = new Set();
        hintNorms = new Set();
        attempts = 0;
        isWon = false;
        selectedWord = null;
        sentenceHintsLeft = SENTENCE_HINTS_PER_ROUND;
        revealHintsLeft = REVEAL_HINTS_PER_ROUND;
        document.getElementById("attemptCount").innerText = 0;
        renderAll();
      }
    });
  }

  function broadcast(data) {
    if (isHost) {
      connections.forEach(c => c.send(data));
    } else if (conn) {
      conn.send(data);
    }
  }

  async function loadArticles() {
    if (articlesCache) return articlesCache;
    const res = await fetch(ARTICLES_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`articles.json konnte nicht geladen werden (Status ${res.status})`);
    articlesCache = await res.json();
    if (!Array.isArray(articlesCache) || articlesCache.length === 0) {
      throw new Error("articles.json ist leer oder ungültig");
    }
    return articlesCache;
  }

  async function startNewGame() {
    if (!isHost) return;
    document.getElementById("content").innerText = "Lade zufälligen Artikel...";
    guessOrder = [];
    guessedNorms = new Set();
    hintNorms = new Set();
    attempts = 0;
    isWon = false;
    selectedWord = null;
    hintRevealed = false;
    sentenceHintsLeft = SENTENCE_HINTS_PER_ROUND;
    revealHintsLeft = REVEAL_HINTS_PER_ROUND;
    document.getElementById("attemptCount").innerText = 0;

    try {
      const articles = await loadArticles();
      const page = articles[Math.floor(Math.random() * articles.length)];
      targetTitle = page.title;
      articleHint = (page.hint || "").trim();
      rawTokens = page.text.match(TOKEN_REGEX) || [];

      renderAll();
      broadcast({ type: 'NEW_GAME', rawTokens, targetTitle, hint: articleHint });
    } catch (e) {
      document.getElementById("content").innerText =
        "Fehler beim Laden von articles.json: " + e.message +
        " — liegt die Datei im selben Ordner wie index.html?";
    }
  }

  function makeGuess() {
    const input = document.getElementById("guessInput");
    const guess = input.value.trim().toLowerCase();
    input.value = "";
    if (!guess || /\s/.test(guess) || isWon) return;
    if (guessedNorms.has(normalize(guess))) return;
    handleGuess(guess, true);
  }

  function handleGuess(guess, isLocal) {
    const norm = normalize(guess);
    if (guessedNorms.has(norm)) return;

    guessedNorms.add(norm);
    guessOrder.push({ word: guess, norm, hint: false });
    attempts++;
    document.getElementById("attemptCount").innerText = attempts;
    selectedWord = norm;

    if (!isWon && isTitleFullyGuessed()) {
      isWon = true;
      setTimeout(() => alert(`Glückwunsch! Artikel "${targetTitle}" wurde gelöst!`), 50);
    }

    renderAll();

    if (isLocal) {
      broadcast({ type: 'GUESS', guess });
    }
  }

  // ---- Hinweise ----

  function useSentenceHint() {
    if (sentenceHintsLeft <= 0 || !targetTitle) return;
    sentenceHintsLeft--;
    hintRevealed = true;
    updateHintButtons();
    renderHintBanner();
    broadcast({ type: 'HINT_SENTENCE' });
  }

  function useRevealHint() {
    if (revealHintsLeft <= 0 || isWon || !targetTitle) return;

    const titleNorms = titleSignificantNorms();
    const candidates = new Map(); // norm -> Beispiel-Wortform
    rawTokens.forEach(token => {
      if (!WORD_REGEX.test(token)) return;
      const lower = token.toLowerCase();
      if (COMMON_WORDS.has(lower)) return;
      const norm = normalize(token);
      if (titleNorms.has(norm)) return;
      if (guessedNorms.has(norm)) return;
      if (!candidates.has(norm)) candidates.set(norm, lower);
    });

    if (candidates.size === 0) {
      alert("Keine weiteren Wörter zum Aufdecken übrig (außerhalb des Titels).");
      return;
    }

    const norms = Array.from(candidates.keys());
    const chosenNorm = norms[Math.floor(Math.random() * norms.length)];
    const word = candidates.get(chosenNorm);

    revealHintsLeft--;
    updateHintButtons();
    applyHintReveal(word, chosenNorm);
    broadcast({ type: 'HINT_REVEAL', word, norm: chosenNorm });
  }

  function applyHintReveal(word, norm) {
    if (guessedNorms.has(norm)) return;
    guessedNorms.add(norm);
    hintNorms.add(norm);
    guessOrder.push({ word, norm, hint: true });
    selectedWord = norm;
    renderAll();
  }

  function renderHintBanner() {
    const banner = document.getElementById("hint-banner");
    if (!hintRevealed) {
      banner.style.display = "none";
      banner.innerText = "";
      return;
    }
    banner.style.display = "block";
    banner.innerText = "💬 Hinweis: " + (articleHint || NO_HINT_TEXT);
  }

  function updateHintButtons() {
    document.getElementById("sentenceHintsLeftEl").innerText = sentenceHintsLeft;
    document.getElementById("revealHintsLeftEl").innerText = revealHintsLeft;
    document.getElementById("hintSentenceBtn").disabled = sentenceHintsLeft <= 0 || !targetTitle;
    document.getElementById("hintRevealBtn").disabled = revealHintsLeft <= 0 || isWon || !targetTitle;
  }

  // ---- Titel / Sieg ----

  function titleSignificantNorms() {
    const titleTokens = targetTitle.match(TOKEN_REGEX) || [];
    const norms = new Set();
    titleTokens.forEach(token => {
      if (!WORD_REGEX.test(token)) return;
      if (COMMON_WORDS.has(token.toLowerCase())) return;
      norms.add(normalize(token));
    });
    return norms;
  }

  function isTitleFullyGuessed() {
    const needed = titleSignificantNorms();
    if (needed.size === 0) return false;
    for (const n of needed) {
      if (!guessedNorms.has(n)) return false;
    }
    return true;
  }

  function toggleSelect(norm) {
    selectedWord = (selectedWord === norm) ? null : norm;
    renderAll();
  }

  function countOccurrences(norm) {
    let n = 0;
    for (const token of rawTokens) {
      if (normalize(token) === norm) n++;
    }
    return n;
  }

  function renderAll() {
    renderTitle();
    renderText();
    renderSidebarList();
    renderHintBanner();
    updateHintButtons();
  }

  function buildWordSpan(token) {
    const isWord = WORD_REGEX.test(token);
    if (!isWord) {
      return document.createTextNode(token);
    }

    const norm = normalize(token);
    const lower = token.toLowerCase();

    if (COMMON_WORDS.has(lower)) {
      const span = document.createElement("span");
      span.className = "common";
      span.innerText = token;
      return span;
    }
    if (isWon || guessedNorms.has(norm)) {
      const span = document.createElement("span");
      const isHintWord = hintNorms.has(norm);
      span.className = "revealed" + (isHintWord ? " hint" : "") + (selectedWord === norm ? " selected" : "");
      span.innerText = token;
      span.onclick = () => toggleSelect(norm);
      return span;
    }
    const span = document.createElement("span");
    span.className = "redacted";
    span.innerText = String(lower.length);
    span.style.minWidth = (lower.length * 0.62 + 0.3) + "em";
    span.style.textAlign = "center";
    return span;
  }

  function renderTitle() {
    const banner = document.getElementById("title-banner");
    banner.innerHTML = "";
    if (!targetTitle) {
      banner.innerText = "Warte auf Spielstart...";
      return;
    }
    const titleTokens = targetTitle.match(TOKEN_REGEX) || [];
    titleTokens.forEach(token => banner.appendChild(buildWordSpan(token)));
  }

  function renderText() {
    const container = document.getElementById("content");
    container.innerHTML = "";
    rawTokens.forEach(token => container.appendChild(buildWordSpan(token)));
  }

  function renderSidebarList() {
    const list = document.getElementById("guessList");
    const emptyHint = document.getElementById("empty-hint");
    list.innerHTML = "";

    if (guessOrder.length === 0) {
      emptyHint.style.display = "block";
      return;
    }
    emptyHint.style.display = "none";

    for (let i = guessOrder.length - 1; i >= 0; i--) {
      const { word, norm, hint } = guessOrder[i];
      const rank = i + 1;
      const count = countOccurrences(norm);
      const isCorrect = norm === normalize(targetTitle) || titleSignificantNorms().has(norm);

      const row = document.createElement("div");
      row.className = "guess-row" + (hint ? " hint" : "") + (selectedWord === norm ? " selected" : "");
      row.onclick = () => toggleSelect(norm);

      row.innerHTML = `
        <span class="guess-rank">#${rank}</span>
        <span class="guess-word${isCorrect ? " correct" : ""}">${escapeHtml(word)}${hint ? " 🔎" : ""}</span>
        <span class="guess-count">${count}</span>
      `;
      list.appendChild(row);
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  updateHintButtons();
</script>
</body>
</html>
